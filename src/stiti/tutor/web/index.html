<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stiti Whiteboard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.css">
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@19.2.0",
  "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
  "react-dom": "https://esm.sh/react-dom@19.2.0",
  "react-dom/client": "https://esm.sh/react-dom@19.2.0/client"
} }
</script>
<link rel="stylesheet" href="/static/board.css">
</head>
<body class="clean">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16Z"/><path d="M5 19V5"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 4 10 8-10 8V4Z"/><path d="M19 5v14"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19 12 7 4.5Z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-slow" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-fast" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  </defs>
</svg>
<div id="shell">
  <header id="head">
    <div id="brand"><span id="mark" aria-hidden="true"></span>Stiti</div>
    <div id="where">
      <div id="lesson"></div>
      <div id="segment"></div>
    </div>
    <div id="meter" aria-live="off">
      <span id="part"></span>
      <div id="track"><div id="fill"></div></div>
    </div>
  </header>
  <div id="board"><div id="loading">Stiti is getting the whiteboard ready…</div></div>
  <div id="check" hidden>
    <div id="check-kind">Your turn</div>
    <div id="check-prompt"></div>
    <div id="check-options"></div>
  </div>
  <aside id="passage" hidden role="dialog" aria-label="Where this answer comes from">
    <div id="passage-head">
      <div><div id="passage-kind">From your notes</div><div id="passage-ref"></div></div>
      <button id="passage-close" aria-label="Close" title="Close (Esc)"><svg><use href="#i-close"/></svg></button>
    </div>
    <p id="passage-text"></p>
  </aside>
  <button id="ask-chip" hidden></button>
  <div id="dock">
    <div id="say">
      <span id="status" class="pill"><i class="dot" aria-hidden="true"></i><span id="status-text">connecting</span></span>
      <div id="caption" aria-live="polite"></div>
    </div>
    <div id="controls">
      <div class="group transport" role="group" aria-label="Lesson">
        <button data-cmd="back" title="Go back (←)" aria-label="Go back"><svg><use href="#i-back"/></svg></button>
        <button id="pp" class="main" data-cmd="pause" title="Pause / play (space)" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
        <button data-cmd="next" title="Skip to next part (→)" aria-label="Skip to next part"><svg><use href="#i-next"/></svg></button>
        <button data-cmd="repeat" title="Say that again (R)" aria-label="Say that again"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="group talk" role="group" aria-label="Talk">
        <button id="mic" title="Hold to talk (or hold Space) · click: only listen while held" aria-label="Hold-to-talk mode" aria-pressed="false"><svg><use href="#i-mic"/></svg></button>
      </div>
      <form id="ask"><input id="q" autocomplete="off" placeholder="Type a doubt or an answer" aria-label="Ask a doubt or type your answer"><kbd aria-hidden="true">H</kbd><button aria-label="Send"><svg><use href="#i-send"/></svg></button></form>
      <div class="group speed" role="group" aria-label="Talking speed">
        <button data-cmd="slower" title="Talk slower" aria-label="Talk slower"><svg><use href="#i-slow"/></svg></button>
        <span class="lbl" id="speed" title="Her talking speed" aria-live="polite">1.0×</span>
        <button data-cmd="faster" title="Talk faster" aria-label="Talk faster"><svg><use href="#i-fast"/></svg></button>
      </div>
      <div class="group view" role="group" aria-label="View">
        <button id="draw" title="Show drawing tools (D)" aria-label="Show drawing tools" aria-pressed="false"><svg><use href="#i-pen"/></svg></button>
        <button id="fs" title="Presenter mode for a big screen (F)" aria-label="Presenter mode"><svg><use href="#i-full"/></svg></button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/static/board.js"></script>
</body>
</html>
