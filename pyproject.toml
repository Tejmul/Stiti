[project]
name = "stiti"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tejmul Movin", email = "tejmulmovin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "funasr>=1.4.24",
    "huggingface-hub>=2.4.0",
    "kokoro-onnx>=0.6.1",
    "laya>=0.4.30",
    "livekit>=1.2.1",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.9",
    "mcp>=2.3.0",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "openai>=1.50",
    "ortools>=9.15.6755",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pyobjc-framework-eventkit>=13.0",
    "python-dateutil>=4.0.0",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "tokenizers>=0.23.3",
]

[project.scripts]
stiti = "stiti:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
